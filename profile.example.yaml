    sensitive: true
    es: "Mi expectativa salarial es negociable según el alcance del rol."
    en: "My salary expectation is negotiable depending on the role scope."
  - key: work_authorization
    question_patterns:
      ["work authorization", "visa", "authorized to work", "autorización de trabajo"]
    sensitive: true
    es: "Soy ciudadana colombiana; requeriría patrocinio para trabajar fuera de Colombia."
    en: "I am a Colombian citizen; I would require sponsorship to work outside Colombia."
  - key: relocation
    question_patterns: ["relocation", "relocate", "reubicación", "reubicarse"]
    sensitive: true
    es: "Estoy abierta a reubicación con apoyo del empleador."
    en: "I am open to relocation with employer support."
  - key: availability
    question_patterns: ["availability", "start date", "disponibilidad", "fecha de inicio"]
    sensitive: false
    es: "Disponible para comenzar con dos semanas de preaviso."
    en: "Available to start with two weeks' notice."
  - key: work_modality
    question_patterns:
      ["remote", "hybrid", "onsite", "modalidad", "presencial", "remoto"]
    sensitive: false
    es: "Prefiero modalidad remota o híbrida."
    en: "I prefer a remote or hybrid modality."
  - key: referral_source
    question_patterns: ["how did you hear", "cómo te enteraste", "source"]
    sensitive: false
    es: "Encontré la oferta en un portal de empleo remoto."
    en: "I found this opening on a remote job board."

